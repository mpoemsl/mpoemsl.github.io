<div id="tours-table-container">
  <p>Loading tour data...</p>
</div>

<style>

  width: 100%;
  border-collapse: collapse;
  font-size: 0.9em;

  background: #f5f5f5;

  cursor: pointer;
  user-select: none;
}
.tours-table th .sort-arrow {
  display: inline-block;
  width: 1em;
  opacity: 0.5;
}
</style>

<script>
(function () {
  var GPX_FILES = [
    { path: '/assets/gpx/hiking_tours/adliswil_felsenegg.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/arth_goldau_gnipen_wildspitz_sattel.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/baden_laegern_dielsdorf.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/ben_nevis.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/gspaltenhornhuette_kandersteg.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/huenenberg_chriesiwanderung.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/krienseregg_pilatus.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/lauterbrunnen_rotstockhuette.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/meilen_pfannenstiel.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/regensberg_laegern_baden.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/reichenbach_falls.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/rotstockhuette_gspaltenhornhuette.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/schindellegi_etzel_st_meinrad_luegeten.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/schwyz_grosser_mythen.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/triemli_uetliberg.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/unteralpli_gnipen_wildspitz.gpx', type: 'Hiking' },
    { path: '/assets/gpx/hiking_tours/zug_zugerberg.gpx', type: 'Hiking' },
    { path: '/assets/gpx/snowshoe_tours/biberegg_guegi.gpx', type: 'Snowshoe' },
    { path: '/assets/gpx/snowshoe_tours/euthal_wisstannenweid.gpx', type: 'Snowshoe' },
    { path: '/assets/gpx/snowshoe_tours/sulwald_lobhorn.gpx', type: 'Snowshoe' }
  ];

  var NS = 'http://www.topografix.com/GPX/1/1';

  function haversine(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var toRad = function (d) { return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
          + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2))
          * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.asin(Math.sqrt(a));
  }

  function elems(node, tag) {
    var r = node.getElementsByTagNameNS(NS, tag);
    if (r.length === 0) r = node.getElementsByTagNameNS('*', tag);
    return r;
  }

  function parseGpx(xmlText, filePath, type) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(xmlText, 'application/xml');

    var nameEl = elems(doc, 'name')[0];
    var name = nameEl
      ? nameEl.textContent.trim().replace(/_/g, ' ')
      : filePath.split('/').pop().replace('.gpx', '').replace(/_/g, ' ');

    var trkpts = elems(doc, 'trkpt');
    var distance = 0, elevGain = 0, elevLoss = 0, elevMax = -Infinity;
    var prevLat = null, prevLon = null, prevEle = null;

    for (var i = 0; i < trkpts.length; i++) {
      var pt = trkpts[i];
      var lat = parseFloat(pt.getAttribute('lat'));
      var lon = parseFloat(pt.getAttribute('lon'));
      var eleEl = elems(pt, 'ele')[0];
      var ele = eleEl ? parseFloat(eleEl.textContent) : null;

      if (prevLat !== null) distance += haversine(prevLat, prevLon, lat, lon);

      if (ele !== null) {
        if (ele > elevMax) elevMax = ele;
        if (prevEle !== null) {
          var diff = ele - prevEle;
          if (diff > 0) elevGain += diff; else elevLoss -= diff;
        }
        prevEle = ele;
      }

      prevLat = lat;
      prevLon = lon;
    }

    return {
      name: name,
      type: type,
      path: filePath,
      distance: distance / 1000,
      elevGain: Math.round(elevGain),
      elevLoss: Math.round(elevLoss),
      elevMax: elevMax === -Infinity ? null : Math.round(elevMax)
    };
  }

  var COLUMNS = [
    { key: 'name', label: 'Name' },
    { key: 'type', label: 'Type' },
    { key: 'distance', label: 'Distance (km)' },
    { key: 'elevGain', label: 'Altitude Gain (m)' },
    { key: 'elevLoss', label: 'Altitude Loss (m)' },
    { key: 'elevMax', label: 'Highest Elevation (m)' }
  ];

  var sortState = { key: 'name', dir: 'asc' };

  function compareRows(a, b, key) {
    var va = a[key], vb = b[key];
    if (typeof va === 'string') return va.localeCompare(vb);
    if (va === null) va = -Infinity;
    if (vb === null) vb = -Infinity;
    return va - vb;
  }

  function renderRows(rows) {
    var sorted = rows.slice().sort(function (a, b) {
      var cmp = compareRows(a, b, sortState.key);
      return sortState.dir === 'asc' ? cmp : -cmp;
    });

    var tbody = document.querySelector('.tours-table tbody');
    var html = '';
    sorted.forEach(function (r) {
      var href = '/tour/?gpx=' + encodeURIComponent(r.path);
      html += '<tr>' +
        '<td><a href="' + href + '">' + r.name + '</a></td>' +
        '<td>' + r.type + '</td>' +
        '<td>' + r.distance.toFixed(1) + '</td>' +
        '<td>' + r.elevGain + '</td>' +
        '<td>' + r.elevLoss + '</td>' +
        '<td>' + (r.elevMax !== null ? r.elevMax : '—') + '</td>' +
        '</tr>';
    });
    tbody.innerHTML = html;

    document.querySelectorAll('.tours-table th').forEach(function (th) {
      var arrow = th.querySelector('.sort-arrow');
      if (!arrow) return;
      if (th.dataset.key === sortState.key) {
        arrow.textContent = sortState.dir === 'asc' ? '▲' : '▼';
      } else {
        arrow.textContent = '';
      }
    });
  }

  function buildTable(rows) {
    var html = '<table class="tours-table"><thead><tr>';
    COLUMNS.forEach(function (col) {
      html += '<th data-key="' + col.key + '">' + col.label + ' <span class="sort-arrow"></span></th>';
    });
    html += '</tr></thead><tbody></tbody></table>';
    document.getElementById('tours-table-container').innerHTML = html;

    document.querySelectorAll('.tours-table th').forEach(function (th) {
      th.addEventListener('click', function () {
        var key = th.dataset.key;
        if (sortState.key === key) {
          sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
        } else {
          sortState.key = key;
          sortState.dir = 'asc';
        }
        renderRows(rows);
      });
    });

    renderRows(rows);
  }

  Promise.all(GPX_FILES.map(function (f) {
    return fetch(f.path)
      .then(function (r) { return r.text(); })
      .then(function (text) { return parseGpx(text, f.path, f.type); });
  })).then(function (rows) {
    buildTable(rows);
  }).catch(function (err) {
    document.getElementById('tours-table-container').innerHTML = '<p>Error loading tour data.</p>';
    console.error(err);
  });
})();
</script>
